# Default configuration for the UAV flow-propagation pipeline.
# Override on the CLI or by passing a second YAML that is merged on top.

paths:
  # Root of the Ruralscapes dataset (frames + dense GT masks). Set this once.
  dataset_root: data/Ruralscapes
  # Which video to process (folder/clip name within the dataset).
  video: DJI_0043
  # SEA-RAFT checkpoint used for optical flow.
  sea_raft_checkpoint: third_party/SEA-RAFT/checkpoints/model.safetensors
  # FlowNet2 checkpoint used when flow.backend is "flownet2".
  flownet2_checkpoint: third_party/flownet2-pytorch/checkpoints/FlowNet2_checkpoint.pth.tar
  # Where run artifacts (tables, figures) are written.
  output_dir: outputs

data:
  # Glob patterns relative to dataset_root for frames and dense GT masks.
  frame_glob: "frames/DJI_0043/*.jpg"
  mask_glob: "labels/manual_labels/DJI_0043/*.png"
  # "color" = RGB PNG where each pixel colour encodes the class;
  # "indexed" = single-channel PNG with raw class ids.
  mask_format: color

flow:
  # Direct-propagation backend: "sea_raft" or "flownet2".
  backend: sea_raft
  # SEA-RAFT model config file (one of the yamls shipped in the submodule).
  # spring-L uses the same checkpoint as spring-M but runs 12 refinement
  # iterations instead of 4, giving better accuracy on GPU.
  model_cfg: third_party/SEA-RAFT/config/eval/spring-L.json
  # Number of recurrent refinement iterations at inference.
  iters: 12
  device: cuda

propagation:
  # Half-width of the propagation window: warp keyframe to +/- window frames.
  window: 30
  # Spacing between keyframes when scaling to the full video (Phase C).
  keyframe_interval: 30
  # Number of annotated frames after the keyframe to evaluate in a single run.
  n_targets: 5

occlusion:
  # Forward-backward consistency threshold (pixels). Pixels whose round-trip
  # error exceeds this are marked invalid (occluded / unreliable).
  fb_threshold: 1.5

eval:
  # Label id to ignore in mIoU (e.g. unlabelled / void). Set per dataset.
  ignore_index: 255
