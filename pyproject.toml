[project]
name = "uav-flowprop"
version = "0.1.0"
description = "Flow-based label propagation for UAV video segmentation (SEA-RAFT)"
requires-python = ">=3.10"
# Runtime dependencies are provided by the conda environment (environment.yml).
# The source packages live flat under ``src/`` (config, flow, warp, eval, data,
# viz) and are imported by putting ``src`` on the path -- scripts do this
# explicitly and pytest is configured below. No editable install is needed.

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
