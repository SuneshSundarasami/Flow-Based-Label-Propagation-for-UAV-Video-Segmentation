data:
  root: ../data/uavid/uavid_v1.5_official_release
  crop_size: 1024
model:
  backbone: hiera_base_plus
  sam2_checkpoint_dir: sam2_checkpoints
train:
  batch_size: 4
  epochs: 200
  lr: 0.0001
  weight_decay: 0.05
  warmup_epochs: 2
  num_workers: 4
  amp: true
  early_stop:
    min_epochs: 40
    patience: 15
    delta: 0.003
output:
  dir: runs
