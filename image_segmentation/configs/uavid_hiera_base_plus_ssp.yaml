# SSP-equivalent Hiera image-teacher recipe, run from image_segmentation/.
data:
  pipeline: ssp
  root: ../third_party/SSP/datasets/UAVid
  crop_size: [1440, 2560]
  augmentation: true
model:
  backbone: hiera_base_plus
  sam2_checkpoint_dir: ../third_party/SSP/base_checkpoints
  upsampling: bicubic
train:
  batch_size: 4
  epochs: 250          # SSP cosine-schedule horizon
  run_epochs: 200      # SSP's normal early_stopping limit
  lr: 0.000025
  weight_decay: 0.05
  warmup_epochs: 2
  start_lr: 0.0001
  final_lr: 0.0001
  num_workers: 4
  amp: false
  early_stop: {}
output:
  dir: runs
